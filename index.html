<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2PD忘年会クイズ</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <h1>🎉 2PD忘年会クイズ 🎉</h1>

  <section id="loading" class="card center"><p class="muted">読み込み中...</p></section>

  <section id="join" class="card hidden">
    <h2>参加する</h2>
    <p class="muted">名前（ニックネーム）を入力してください。</p>
    <input id="name" type="text" maxlength="20" placeholder="例: たろう" autocomplete="off">
    <button id="joinBtn" class="full">参加する</button>
    <p id="joinMsg" class="msg"></p>
  </section>

  <section id="waiting" class="card center hidden">
    <p class="big">⏳</p>
    <h2><span id="who"></span> さん、参加OK！</h2>
    <p>クイズの開始までお待ちください。<br>幹事の合図で自動的に始まります。</p>
  </section>

  <section id="quiz" class="card hidden">
    <div class="progress"><div id="bar"></div></div>
    <div class="qnum" id="qnum"></div>
    <div class="qtext" id="qtext"></div>
    <div id="choices"></div>
  </section>

  <section id="submitting" class="card center hidden">
    <p id="submitMsg">送信中...</p>
    <button id="retryBtn" class="hidden">もう一度送信</button>
  </section>

  <section id="done" class="card center hidden">
    <p class="big">✅</p>
    <h2>回答完了！</h2>
    <p>お疲れさまでした。<br>結果は忘年会の後半に発表します。お楽しみに！</p>
  </section>

  <section id="error" class="card hidden"><p class="msg" id="errorMsg"></p></section>
</main>

<script type="module">
import { firebaseConfig, FIREBASE_SDK } from "./firebase-config.js";
const { initializeApp } = await import(`${FIREBASE_SDK}/firebase-app.js`);
const { getAuth, signInAnonymously } = await import(`${FIREBASE_SDK}/firebase-auth.js`);
const { getFirestore, doc, getDoc, setDoc, getDocs, collection, onSnapshot, serverTimestamp } =
  await import(`${FIREBASE_SDK}/firebase-firestore.js`);

const $ = (id) => document.getElementById(id);
const show = (id) => {
  for (const s of document.querySelectorAll("main > section")) s.classList.toggle("hidden", s.id !== id);
};
const fail = (msg) => { $("errorMsg").textContent = msg; show("error"); };

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let uid, name = "", isOpen = false, questions = null, started = false, finished = false;
const LS = "bonenkai-quiz-v1";
const loadLocal = () => { try { return JSON.parse(localStorage.getItem(LS)) || {}; } catch { return {}; } };
const saveLocal = (o) => { try { localStorage.setItem(LS, JSON.stringify({ ...loadLocal(), ...o })); } catch {} };

try {
  const cred = await signInAnonymously(auth);
  uid = cred.user.uid;
} catch (e) {
  fail("ログインに失敗しました。通信状況を確認して再読み込みしてください。");
  throw e;
}

// すでに回答済みなら完了画面へ
try {
  if ((await getDoc(doc(db, "responses", uid))).exists()) { finished = true; show("done"); }
} catch (e) { console.error(e); }

if (!finished) {
  try {
    const p = await getDoc(doc(db, "participants", uid));
    if (p.exists()) name = p.data().name;
  } catch (e) { console.error(e); }

  if (!name) { saveLocal({ choices: [], times: [] }); show("join"); } // 登録が無い=新規(または全削除後)。端末に残った途中データを捨てる
  else enterWaiting();

  onSnapshot(doc(db, "config", "state"), (snap) => {
    isOpen = !!(snap.exists() && snap.data().open);
    update();
  }, (e) => { console.error(e); });
}

$("joinBtn").onclick = async () => {
  const n = $("name").value.trim();
  if (!n) { $("joinMsg").textContent = "名前を入力してください。"; return; }
  $("joinBtn").disabled = true;
  try {
    await setDoc(doc(db, "participants", uid), { name: n, joinedAt: serverTimestamp() });
    name = n;
    enterWaiting();
  } catch (e) {
    console.error(e);
    $("joinMsg").textContent = "参加登録に失敗しました。もう一度お試しください。";
    $("joinBtn").disabled = false;
  }
};

function enterWaiting() {
  $("who").textContent = name;
  show("waiting");
  update();
}

async function update() {
  if (finished || started || !name) return;
  if (!isOpen) { show("waiting"); return; }
  started = true;
  try {
    const snap = await getDocs(collection(db, "questions"));
    questions = snap.docs.map((d) => ({ id: d.id, ...d.data() })).sort((a, b) => a.order - b.order);
    if (!questions.length) throw new Error("no questions");
  } catch (e) {
    console.error(e); started = false;
    fail("問題を取得できませんでした。幹事に声をかけてください。");
    return;
  }
  runQuiz();
}

function runQuiz() {
  const saved = loadLocal();
  const choices = Array.isArray(saved.choices) ? saved.choices.slice(0, questions.length) : [];
  const times = Array.isArray(saved.times) ? saved.times.slice(0, questions.length) : [];
  let i = choices.length;
  let shownAt = Date.now();
  let locked = false;

  const render = () => {
    if (i >= questions.length) return submit(choices, times);
    const q = questions[i];
    $("bar").style.width = `${(i / questions.length) * 100}%`;
    $("qnum").textContent = `第${i + 1}問 / ${questions.length}問`;
    $("qtext").textContent = q.question;
    const box = $("choices");
    box.replaceChildren();
    q.choices.forEach((c, idx) => {
      const b = document.createElement("button");
      b.className = "choice";
      const l = document.createElement("b");
      l.textContent = "ABCD"[idx];
      b.append(l, document.createTextNode(c));
      b.onclick = () => {
        if (locked) return;
        locked = true;
        choices.push(idx);
        times.push(Date.now() - shownAt);
        saveLocal({ choices, times });
        i++; shownAt = Date.now(); locked = false;
        render();
      };
      box.append(b);
    });
    show("quiz");
  };
  render();
}

async function submit(choices, times) {
  show("submitting");
  $("submitMsg").textContent = "送信中...";
  $("retryBtn").classList.add("hidden");
  try {
    await setDoc(doc(db, "responses", uid), { name, choices, times, submittedAt: serverTimestamp() });
    finished = true;
    saveLocal({ choices: [], times: [] });
    show("done");
  } catch (e) {
    console.error(e);
    if (e.code === "permission-denied") {
      // すでに保存済み(上書き禁止) or 締切後
      try {
        if ((await getDoc(doc(db, "responses", uid))).exists()) { finished = true; show("done"); return; }
      } catch {}
      $("submitMsg").textContent = "送信できませんでした（受付が締め切られた可能性があります）。幹事に声をかけてください。";
    } else {
      $("submitMsg").textContent = "送信に失敗しました。通信状況を確認してもう一度押してください。";
    }
    $("retryBtn").classList.remove("hidden");
    $("retryBtn").onclick = () => submit(choices, times);
  }
}
</script>
</body>
</html>
